plugins {
    id 'java'
}

group = 'com.crashassistant'
version = '1.0.0'

def lwjglVersion = '3.3.3'

repositories {
    mavenCentral()
}

configurations {
    vulkanLib
    lwjglLib
    nativesLib
}

dependencies {
    vulkanLib "org.lwjgl:lwjgl-vulkan:$lwjglVersion"
    lwjglLib "org.lwjgl:lwjgl:$lwjglVersion"

    // Native libraries
    nativesLib "org.lwjgl:lwjgl:$lwjglVersion:natives-linux-arm32"
    nativesLib "org.lwjgl:lwjgl:$lwjglVersion:natives-linux-arm64"
    nativesLib "org.lwjgl:lwjgl:$lwjglVersion:natives-linux"
    nativesLib "org.lwjgl:lwjgl:$lwjglVersion:natives-macos-arm64"
    nativesLib "org.lwjgl:lwjgl:$lwjglVersion:natives-macos"
    nativesLib "org.lwjgl:lwjgl:$lwjglVersion:natives-windows-arm64"
    nativesLib "org.lwjgl:lwjgl:$lwjglVersion:natives-windows-x86"
    nativesLib "org.lwjgl:lwjgl:$lwjglVersion:natives-windows"

    // MoltenVK for macOS
    nativesLib "org.lwjgl:lwjgl-vulkan:$lwjglVersion:natives-macos"
    nativesLib "org.lwjgl:lwjgl-vulkan:$lwjglVersion:natives-macos-arm64"
}

// Set the JAR name to match the required format
jar {
    archiveBaseName = 'CrashAssistantVulkanGPUDetectionAddon'
    archiveVersion = lwjglVersion

    doLast {
        // Get the vulkan JAR file
        def vulkanJar = configurations.vulkanLib.files.find { it.name.contains('lwjgl-vulkan') }
        // Get the core lwjgl JAR file
        def lwjglJar = configurations.lwjglLib.files.find { it.name.contains('lwjgl-') && !it.name.contains('lwjgl-vulkan') }
        // Get all native library JAR files
        def nativeJars = configurations.nativesLib.files

        // Create a temporary directory to store the JAR files
        def tempDir = new File(temporaryDir, 'jarjar')
        tempDir.mkdirs()

        if (vulkanJar) {
            // Copy the vulkan JAR to the temporary directory
            def vulkanTargetFile = new File(tempDir, vulkanJar.name)
            vulkanTargetFile.bytes = vulkanJar.bytes

            // Add the vulkan JAR to META-INF/jarjar
            ant.jar(destfile: archiveFile.get().asFile, update: true) {
                zipfileset(file: vulkanTargetFile, prefix: "META-INF/jarjar")
            }
        } else {
            throw new GradleException("Could not find lwjgl-vulkan JAR in dependencies")
        }

        if (lwjglJar) {
            // Copy the core lwjgl JAR to the temporary directory
            def lwjglTargetFile = new File(tempDir, lwjglJar.name)
            lwjglTargetFile.bytes = lwjglJar.bytes

            // Add the core lwjgl JAR to META-INF/jarjar
            ant.jar(destfile: archiveFile.get().asFile, update: true) {
                zipfileset(file: lwjglTargetFile, prefix: "META-INF/jarjar")
            }
        } else {
            throw new GradleException("Could not find core lwjgl JAR in dependencies")
        }

        // Process all native library JAR files
        if (nativeJars) {
            nativeJars.each { nativeJar ->
                // Copy the native JAR to the temporary directory
                def nativeTargetFile = new File(tempDir, nativeJar.name)
                nativeTargetFile.bytes = nativeJar.bytes

                // Add the native JAR to META-INF/jarjar
                ant.jar(destfile: archiveFile.get().asFile, update: true) {
                    zipfileset(file: nativeTargetFile, prefix: "META-INF/jarjar")
                }
            }
        } else {
            throw new GradleException("Could not find any native library JARs in dependencies")
        }
    }
}
